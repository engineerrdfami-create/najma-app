<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نجمه - التعليقات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #111B38 0%, #070C1E 100%);
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .comments-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }
        .back-btn {
            color: #3A86EF;
            text-decoration: none;
            font-size: 16px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }
        /* قائمة التعليقات */
        .comments-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }
        .comment-item {
            background: rgba(28, 37, 65, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .comment-user {
            font-size: 13px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 14px;
            color: #E2E8F0;
            line-height: 1.4;
            word-break: break-word;
        }
        .empty-comments {
            text-align: center;
            color: #8C92A4;
            margin-top: 50px;
            font-size: 14px;
        }
        /* صندوق إدخال التعليق السفلي */
        .comment-input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 19, 43, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 20;
        }
        .comment-input {
            flex-grow: 1;
            height: 40px;
            background-color: #0B132B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0 15px;
            color: #FFFFFF;
            font-size: 13px;
            outline: none;
        }
        .comment-input:focus {
            border-color: #3A86EF;
        }
        .send-btn {
            background-color: #3A86EF;
            color: #FFFFFF;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .send-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="comments-container">
        <!-- شريط العنوان العلوي -->
        <div class="header">
            <a href="feed.html" class="back-btn">← عودة</a>
            <div class="title">التعليقات</div>
            <div style="width: 40px;"></div>
        </div>

        <!-- قائمة عرض التعليقات -->
        <div class="comments-list" id="commentsList">
            <!-- سيتم تحميل التعليقات ديناميكياً هنا -->
        </div>

        <!-- حقل إضافة تعليق -->
        <div class="comment-input-area">
            <input type="text" class="comment-input" id="commentInput" placeholder="اكتب تعليقاً لطيفاً... 💬">
            <button class="send-btn" onclick="addComment()">➤</button>
        </div>
    </div>

    <script>
        // تحميل التعليقات عند فتح الصفحة
        window.onload = function() {
            loadComments();
        };

        // عرض التعليقات من LocalStorage
        function loadComments() {
            let comments = JSON.parse(localStorage.getItem('najma_comments')) || [];
            const listContainer = document.getElementById('commentsList');
            listContainer.innerHTML = '';

            if (comments.length === 0) {
                listContainer.innerHTML = '<div class="empty-comments">لا توجد تعليقات بعد.. كن أول من يعلق! ✨</div>';
                return;
            }

            comments.forEach(com => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-user">@${com.username}</div>
                    <div class="comment-text">${com.text}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        // إضافة تعليق جديد وحفظه
        function addComment() {
            const inputField = document.getElementById('commentInput');
            const text = inputField.value.trim();

            if (!text) {
                return; // لا تقم بإضافة تعليق فارغ
            }

            const currentUsername = localStorage.getItem('najma_username') || 'najma_user';

            let comments = JSON.parse(localStorage.getItem('najma_comments')) || [];
            
            // إضافة التعليق الجديد في البداية
            comments.unshift({
                username: currentUsername,
                text: text
            });

            localStorage.setItem('najma_comments', JSON.stringify(comments));

            // تفريغ الحقل وإعادة تحميل القائمة
            inputField.value = '';
            loadComments();
        }
    </script>
</body>
</html>
