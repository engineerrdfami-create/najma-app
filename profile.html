<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - نجمه</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            background-color: #070C1E;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* الشريط العلوي */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(7, 12, 30, 0.85), transparent);
        }
        .top-icon-btn {
            background: rgba(28, 37, 65, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 16px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: transform 0.2s;
            border: none;
        }
        .top-icon-btn:active { transform: scale(0.92); }
        .top-icon-btn:hover { background: rgba(255, 215, 0, 0.2); border-color: #FFD700; }
        .app-logo-title {
            font-size: 16px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* محتوى الملف الشخصي */
        .profile-container {
            height: 100vh;
            width: 100%;
            overflow-y: auto;
            padding-top: 80px;
            padding-bottom: 80px;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* بطاقة الملف الشخصي */
        .profile-card {
            background: rgba(28, 37, 65, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FF6B9D);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 12px;
            border: 3px solid #FFD700;
        }
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
        }
        .profile-username {
            font-size: 14px;
            color: #8C92A4;
            margin-bottom: 8px;
        }
        .profile-bio {
            font-size: 13px;
            color: #E2E8F0;
            line-height: 1.5;
        }

        /* زر الأدوات (الثلاث نقاط) */
        .tools-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tools-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFD700;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
        }
        .tools-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            transform: scale(1.02);
        }
        .tools-btn .arrow {
            transition: transform 0.3s;
            display: inline-block;
        }
        .tools-btn .arrow.open {
            transform: rotate(180deg);
        }

        /* القائمة المنسدلة */
        .dropdown-menu {
            background: rgba(28, 37, 65, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(15px);
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.5s ease, opacity 0.4s ease, margin 0.3s ease;
            margin-bottom: 0;
        }
        .dropdown-menu.open {
            max-height: 800px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            color: #E2E8F0;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .dropdown-item:active {
            transform: scale(0.98);
        }
        .dropdown-item .icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }
        .dropdown-item .label {
            flex: 1;
        }
        .dropdown-item .badge {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
        }
        .dropdown-item .arrow-left {
            color: #8C92A4;
            font-size: 12px;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(11, 27, 56, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }
        .nav-item {
            color: #8C92A4;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active { color: #FFD700; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-header">
        <button class="top-icon-btn" onclick="history.back()" title="رجوع">←</button>
        <div class="app-logo-title">👤 حسابي</div>
        <button class="top-icon-btn" onclick="window.location.href='settings.html'" title="الإعدادات">⚙️</button>
    </div>

    <!-- محتوى الملف الشخصي -->
    <div class="profile-container">

        <!-- بطاقة الملف الشخصي -->
        <div class="profile-card">
            <div class="profile-avatar">⭐</div>
            <div class="profile-name">نجمه</div>
            <div class="profile-username">@najma_user</div>
            <div class="profile-bio">🚀 مرحباً بك في عالم نجمه ✨</div>
        </div>

        <!-- زر الأدوات -->
        <div class="tools-btn-wrapper">
            <button class="tools-btn" id="toolsToggleBtn" onclick="toggleDropdown()">
                <span>⚡ الأدوات والمزيد</span>
                <span class="arrow" id="arrowIcon">▼</span>
            </button>
        </div>

        <!-- القائمة المنسدلة -->
        <div class="dropdown-menu" id="dropdownMenu">

            <!-- الأصول -->
            <a href="#" class="dropdown-item" onclick="navigateTo('assets.html', 'الأصول')">
                <span class="icon">💰</span>
                <span class="label">الأصول</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- رصيد -->
            <a href="#" class="dropdown-item" onclick="navigateTo('balance.html', 'رصيد')">
                <span class="icon">💳</span>
                <span class="label">رصيد</span>
                <span class="badge">12,500 ⭐</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- الأدوات الشخصية -->
            <a href="#" class="dropdown-item" onclick="navigateTo('personal-tools.html', 'الأدوات الشخصية')">
                <span class="icon">🛠️</span>
                <span class="label">الأدوات الشخصية</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- مركز الأنشطة -->
            <a href="#" class="dropdown-item" onclick="navigateTo('activity-center.html', 'مركز الأنشطة')">
                <span class="icon">📊</span>
                <span class="label">مركز الأنشطة</span>
                <span class="badge">جديد</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- فيديوهات دون اتصال -->
            <a href="#" class="dropdown-item" onclick="navigateTo('offline-videos.html', 'فيديوهات دون اتصال')">
                <span class="icon">📥</span>
                <span class="label">فيديوهات دون اتصال بالإنترنت</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- رمز QR -->
            <a href="#" class="dropdown-item" onclick="navigateTo('qr-code.html', 'رمز QR')">
                <span class="icon">📱</span>
                <span class="label">رمز QR لديك</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- أدوات الإبداع والأعمال -->
            <a href="#" class="dropdown-item" onclick="navigateTo('creative-tools.html', 'أدوات الإبداع والأعمال')">
                <span class="icon">🎨</span>
                <span class="label">أدوات الإبداع والأعمال</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- TikTok Studio -->
            <a href="#" class="dropdown-item" onclick="navigateTo('tiktok-studio.html', 'TikTok Studio')">
                <span class="icon">🎬</span>
                <span class="label">TikTok Studio</span>
                <span class="arrow-left">›</span>
            </a>

            <!-- الإعدادات والخصوصية -->
            <a href="#" class="dropdown-item" onclick="navigateTo('privacy-settings.html', 'الإعدادات والخصوصية')">
                <span class="icon">🔒</span>
                <span class="label">الإعدادات والخصوصية</span>
                <span class="arrow-left">›</span>
            </a>

        </div>

        <!-- مساحة فارغة -->
        <div style="height: 20px;"></div>

    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="feed.html" class="nav-item"><span class="nav-icon">🏠</span><span>الرئيسية</span></a>
        <a href="explore.html" class="nav-item"><span class="nav-icon">🔍</span><span>استكشاف</span></a>
        <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>نشر</span></a>
        <a href="messages.html" class="nav-item"><span class="nav-icon">💬</span><span>الرسائل</span></a>
        <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span>حسابي</span></a>
    </div>

    <script>
        // ===== دالة فتح وإغلاق القائمة =====
        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('arrowIcon');
            
            menu.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        // ===== دالة التنقل إلى الصفحات =====
        function navigateTo(page, itemName) {
            // إغلاق القائمة
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('arrowIcon');
            menu.classList.remove('open');
            arrow.classList.remove('open');
            
            // محاولة الانتقال إلى الصفحة
            try {
                window.location.href = page;
            } catch(e) {
                // إذا الصفحة غير موجودة، نعرض رسالة
                alert('📄 جارٍ التوجه إلى: ' + itemName + '\n(الصفحة قيد التطوير)');
            }
        }

        // ===== إغلاق القائمة عند النقر خارجها =====
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdownMenu');
            const btn = document.getElementById('toolsToggleBtn');
            
            if (!btn.contains(event.target) && !menu.contains(event.target)) {
                menu.classList.remove('open');
                document.getElementById('arrowIcon').classList.remove('open');
            }
        });

        // ===== منع إغلاق القائمة عند النقر داخلها =====
        document.getElementById('dropdownMenu').addEventListener('click', function(event) {
            event.stopPropagation();
        });

        // ===== تحميل اسم المستخدم من localStorage =====
        window.onload = function() {
            let savedName = localStorage.getItem('najma_username');
            if(savedName) {
                document.querySelector('.profile-name').textContent = savedName;
                document.querySelector('.profile-username').textContent = '@' + savedName;
            }
        };
    </script>

</body>
</html>
