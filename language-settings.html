<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نجمه - لغة التطبيق</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #111B38 0%, #070C1E 100%);
            color: #FFFFFF; font-family: Arial, sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .back-btn {
            background: rgba(28, 37, 65, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        .title { font-size: 18px; font-weight: bold; color: #FFD700; }
        .lang-option {
            background: rgba(28, 37, 65, 0.5); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s;
        }
        .lang-option.active { border-color: #FFD700; background: rgba(255, 215, 0, 0.1); }
        .lang-name { font-size: 15px; font-weight: bold; color: #FFF; }
        .check-mark { color: #FFD700; font-size: 18px; display: none; }
        .lang-option.active .check-mark { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="settings.html" class="back-btn">➔</a>
            <div class="title">لغة التطبيق 🌐</div>
            <div style="width: 36px;"></div>
        </div>

        <div class="lang-option active" id="lang-ar" onclick="selectLang('ar')">
            <div class="lang-name">العربية (Arabic)</div>
            <div class="check-mark">✔</div>
        </div>

        <div class="lang-option" id="lang-en" onclick="selectLang('en')">
            <div class="lang-name">الإنجليزية (English)</div>
            <div class="check-mark">✔</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let current = localStorage.getItem('najma_lang') || 'ar';
            document.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
            document.getElementById('lang-' + current).classList.add('active');
        };

        function selectLang(langCode) {
            localStorage.setItem('najma_lang', langCode);
            document.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
            document.getElementById('lang-' + langCode).classList.add('active');
            alert(langCode === 'ar' ? 'تم حفظ اللغة العربية بنجاح 🌐' : 'English language saved successfully 🌐');
        }
    </script>
</body>
</html>
