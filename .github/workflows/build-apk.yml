name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK using Capacitor
        run: |
          mkdir build_app && cd build_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 1. تهيئة مشروع Capacitor
          npx cap init "Najma App" "com.najma.app" --web-dir www
          mkdir www
          
          # 2. توجيه التطبيق لرابط الموقع مباشرة
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://engineerrdfani-create.github.io/najma-app/"></head><body></body></html>' > www/index.html
          
          # 3. إعداد أندرويد وبنائه
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # 4. نقل ملف الـ APK إلى المجلد الرئيسي
          cp app/build/outputs/apk/debug/app-debug.apk ../../najma-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-apk
          path: "najma-app.apk"
