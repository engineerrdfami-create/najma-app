name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Native Files
        run: |
          # 1. تثبيت Capacitor
          mkdir -p build_app && cd build_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 2. تهيئة المشروع
          npx cap init "Najma App" "com.najma.app" --web-dir www
          mkdir -p www
          
          # 3. نسخ ملفات مشروعك الحقيقية بالكامل إلى مجلد البناء
          cp -r ../* www/ 2>/dev/null || true
          
          # 4. إضافة منصة أندرويد وبناء الـ APK
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # 5. استخراج ملف APK النهائي
          cp app/build/outputs/apk/debug/app-debug.apk ../../najma-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-apk
          path: "najma-app.apk"
