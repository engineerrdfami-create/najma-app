name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Webview Android App
        run: |
          npm install -g pwa-to-apk
          pwa-to-apk --url https://engineerrdfani-create.github.io/najma-app/ --out output.apk || true

      - name: Alternative Cordova Build
        run: |
          if [ ! -f "output.apk" ]; then
            npm install -g cordova
            cordova create myApp com.najma.app Najma
            cd myApp
            cordova platform add android
            echo '<script>window.location.href="https://engineerrdfani-create.github.io/najma-app/";</script>' > www/index.html
            cordova build android --release
            cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../output.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "output.apk"
