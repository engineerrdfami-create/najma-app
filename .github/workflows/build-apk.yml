name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Fix Manifest and Build APK
        run: |
          # 1. ضبط إعدادات Bubblewrap لتفادي الأسئلة التفاعلية
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

          # 2. ضمان وجود رابط URL صحيح داخل manifest.json
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.start_url = 'https://engineerrdfani-create.github.io/najma-app/';
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));
          "

          # 3. البناء
          npx @bubblewrap/cli init --manifest="$(pwd)/manifest.json" --skipKeygen
          npx @bubblewrap/cli build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "*.apk"
