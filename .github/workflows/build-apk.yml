name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: PWABuilder Action
        uses: pwa-builder/pwa-action@v1
        with:
          pwa-url: "https://engineerrdfani-create.github.io/najma-app/"
          output-type: "apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-apk
          path: ./**/*.apk
