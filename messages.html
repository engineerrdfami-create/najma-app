<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نجمه - الرسائل</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #111B38 0%, #070C1E 100%);
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .content-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #3A86EF;
            text-decoration: none;
            font-size: 16px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
        }
        /* شريط البحث في الرسائل */
        .search-box {
            width: 100%;
            height: 42px;
            background: rgba(28, 37, 65, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0 14px;
            color: #FFFFFF;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-input {
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        .search-input::placeholder {
            color: #8C92A4;
        }
        /* قائمة المحادثات */
        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .chat-item {
            background: rgba(28, 37, 65, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-item:active {
            background: rgba(40, 53, 89, 0.8);
        }
        .chat-avatar {
            width: 45px;
            height: 45px;
            background-color: #0B132B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid #3A86EF;
        }
        .chat-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .chat-username {
            font-size: 15px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 4px;
        }
        .chat-last-msg {
            font-size: 12px;
            color: #8C92A4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        .chat-time {
            font-size: 10px;
            color: #64748B;
        }
        .unread-badge {
            background-color: #3A86EF;
            color: #FFFFFF;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* شريط التنقل السفلي */
        .bottom-nav {
            height: 60px;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }
        .nav-item {
            color: #8C92A4;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .nav-item.active {
            color: #3A86EF;
        }
    </style>
</head>
<body>

    <div class="content-area">
        <div class="header">
            <a href="feed.html" class="back-btn">← عودة</a>
            <div class="title">الرسائل</div>
            <div style="width: 40px;"></div>
        </div>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" class="search-input" placeholder="ابحث في المحادثات...">
        </div>

        <div class="chats-list">
            <div class="chat-item" onclick="alert('فتح محادثة أحمد محمد')">
                <div class="chat-avatar">👨‍💻</div>
                <div class="chat-info">
                    <div class="chat-username">أحمد محمد</div>
                    <div class="chat-last-msg">فكرة التطبيق ممتازة جداً، متى سنطلق النسخة...</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">منذ 5د</div>
                    <div class="unread-badge">2</div>
                </div>
            </div>

            <div class="chat-item" onclick="alert('فتح محادثة سارة علي')">
                <div class="chat-avatar">⭐</div>
                <div class="chat-info">
                    <div class="chat-username">سارة علي</div>
                    <div class="chat-last-msg">شكراً لك على التصميم الرائع والمذهل!</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">منذ ساعة</div>
                </div>
            </div>

            <div class="chat-item" onclick="alert('فتح محادثة خالد العمري')">
                <div class="chat-avatar">🚀</div>
                <div class="chat-info">
                    <div class="chat-username">خالد العمري</div>
                    <div class="chat-last-msg">هل قمت برفع الفيديو الأخير على المنصة؟</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">أمس</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="feed.html" class="nav-item">الرئيسية</a>
        <a href="explore.html" class="nav-item">اكتشف</a>
        <a href="upload.html" class="nav-item">➕ إنشاء</a>
        <a href="notifications.html" class="nav-item">الإشعارات</a>
        <a href="profile.html" class="nav-item">الملف الشخصي</a>
    </div>

</body>
</html>
